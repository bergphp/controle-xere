<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle de Viagens - Xerém</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --dark: #1b5e20;
            --bg: #f1f8e9;
            --card: #ffffff;
            --text: #333333;
            --pdf-btn: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* Tela de Seleção de Usuário */
        #userSelectionOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .user-btn {
            width: 80%;
            max-width: 300px;
            padding: 15px;
            margin: 10px;
            font-size: 18px;
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .user-btn:hover { background: var(--primary); color: white; }

        #loadingOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85);
            border-radius: 12px;
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        h1, h2 { text-align: center; color: var(--dark); }
        h2 { font-size: 18px; border-bottom: 2px solid var(--bg); padding-bottom: 8px; color: var(--primary); margin-top: 25px; }

        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 14px; }

        select, input, button { padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        
        .checkbox-group { display: flex; gap: 15px; margin-top: 5px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; background: #eee; padding: 8px 12px; border-radius: 6px; font-size: 14px; }

        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-pdf { background-color: var(--pdf-btn); width: 100%; margin-top: 10px; }

        .summary-box {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-value { font-size: 20px; font-weight: bold; color: var(--dark); }

        .travel-card {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-left: 5px solid var(--primary-light);
        }

        .badge { padding: 3px 8px; border-radius: 10px; font-size: 11px; color: white; font-weight: bold; }
        .badge-ida { background: #0288d1; }
        .badge-volta { background: #f57c00; }

        #customNotesGroup { display: none; margin-top: 10px; }

        /* PDF Layout */
        .pdf-page-container { font-family: Arial, sans-serif; padding: 20px; width: 750px; background: white; }
        .pdf-card { border: 1px solid #ddd; border-left: 5px solid #4caf50; padding: 12px; margin-bottom: 10px; page-break-inside: avoid; }
    </style>
</head>
<body>

    <!-- Tela Inicial de Identificação -->
    <div id="userSelectionOverlay">
        <h1 style="color: var(--dark)">Quem está acessando?</h1>
        <p>Selecione seu nome para ver seu relatório</p>
        <button class="user-btn" onclick="setUser('Gabriel')">Gabriel</button>
        <button class="user-btn" onclick="setUser('Rafael')">Rafael</button>
        <button class="user-btn" onclick="setUser('Juliana')">Juliana</button>
    </div>

    <div class="container">
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <span id="loadingText">Sincronizando...</span>
        </div>

        <h1 id="userTitle">📍 Minhas Viagens</h1>
        
        <form id="travelForm">
            <div class="form-group">
                <label>Data da Viagem:</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label>Tipo:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" id="cIda" checked> Ida</label>
                    <label class="checkbox-label"><input type="checkbox" id="cVolta"> Volta</label>
                </div>
            </div>

            <div class="form-group">
                <label>Meio de Transporte:</label>
                <select id="notesSelect" onchange="toggleCustomNotes()">
                    <option value="Carro do Berg">Carro do Berg</option>
                    <option value="Uber">Uber</option>
                    <option value="Outro">Outro...</option>
                </select>
                <div id="customNotesGroup">
                    <input type="text" id="customNotes" placeholder="Descreva aqui...">
                </div>
            </div>

            <button type="submit" style="width: 100%">Registrar Agora</button>
        </form>

        <br><hr><br>

        <h2>Meu Relatório Financeiro</h2>
        
        <div class="summary-box">
            <div>
                <p>Total de Viagens: <span id="resCount">0</span></p>
                <small>R$ 12,50 por trecho</small>
            </div>
            <div class="summary-value" id="resTotal">R$ 0,00</div>
        </div>

        <button class="btn-pdf" onclick="downloadPDF()">📄 Baixar Meu PDF</button>
        <p style="text-align: center;"><a href="javascript:void(0)" onclick="logout()" style="color: #666; font-size: 12px;">Trocar de usuário</a></p>

        <div id="list"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz2-8xldXs-VKsMiCIqwZyKR9K3Kl26VOCMHOiD47O9uQugqQZ1UK1zRBffD1vXnKMF/exec";
        const PRECO = 12.50;
        let currentUser = localStorage.getItem('viagens_user') || null;
        let trips = [];

        // Inicialização
        if (currentUser) {
            document.getElementById('userSelectionOverlay').style.display = 'none';
            document.getElementById('userTitle').innerText = `📍 Viagens de ${currentUser}`;
            fetchTripsFromCloud();
        }

        function setUser(name) {
            currentUser = name;
            localStorage.setItem('viagens_user', name);
            document.getElementById('userSelectionOverlay').style.display = 'none';
            document.getElementById('userTitle').innerText = `📍 Viagens de ${currentUser}`;
            fetchTripsFromCloud();
        }

        function logout() {
            localStorage.removeItem('viagens_user');
            location.reload();
        }

        function showLoading(text) {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

        function toggleCustomNotes() {
            const selectValue = document.getElementById('notesSelect').value;
            document.getElementById('customNotesGroup').style.display = (selectValue === 'Outro') ? 'block' : 'none';
        }

        function formatDateTime(rawDateStr) {
            if (!rawDateStr) return "--";
            const dataObj = new Date(rawDateStr);
            if (isNaN(dataObj.getTime())) return rawDateStr;
            const d = dataObj.toLocaleDateString('pt-BR');
            const h = dataObj.toLocaleTimeString('pt-BR');
            return h === "00:00:00" ? d : `${d} às ${h}`;
        }

        async function fetchTripsFromCloud() {
            showLoading("Carregando seus dados...");
            try {
                const response = await fetch(API_URL);
                const rawData = await response.json();
                // AQUI ESTÁ A MÁGICA: Filtra os dados da planilha pelo usuário logado
                trips = rawData
                    .map(row => ({ date: row[0], passenger: row[1], type: row[2], notes: row[3] }))
                    .filter(t => t.passenger === currentUser);
                render();
            } catch (error) { console.error(error); } finally { hideLoading(); }
        }

        async function saveTripToCloud(tripData) {
            showLoading("Salvando...");
            const formBody = [];
            for (const key in tripData) formBody.push(encodeURIComponent(key) + "=" + encodeURIComponent(tripData[key]));
            
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formBody.join("&") });
            await fetchTripsFromCloud();
        }

        document.getElementById('travelForm').onsubmit = async (e) => {
            e.preventDefault();
            const dateVal = document.getElementById('date').value || new Date().toISOString().split('T')[0];
            const now = new Date();
            const fullDateTime = new Date(`${dateVal}T${now.toTimeString().split(' ')[0]}`);
            const notes = document.getElementById('notesSelect').value === 'Outro' ? document.getElementById('customNotes').value : document.getElementById('notesSelect').value;
            
            if (document.getElementById('cIda').checked) {
                await saveTripToCloud({ date: fullDateTime.toISOString(), passenger: currentUser, type: 'Ida', notes: notes });
            }
            if (document.getElementById('cVolta').checked) {
                await saveTripToCloud({ date: fullDateTime.toISOString(), passenger: currentUser, type: 'Volta', notes: notes });
            }
            alert("Registrado!");
        };

        function render() {
            document.getElementById('resCount').innerText = trips.length;
            document.getElementById('resTotal').innerText = (trips.length * PRECO).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
            const list = document.getElementById('list');
            list.innerHTML = trips.length ? "" : "<p style='text-align:center; color:#999'>Nenhuma viagem sua encontrada.</p>";
            [...trips].reverse().forEach(t => {
                list.innerHTML += `<div class="travel-card"><p><strong>${t.type}</strong></p><p>📅 ${formatDateTime(t.date)} | 🚘 ${t.notes}</p></div>`;
            });
        }

        function downloadPDF() {
            const pdfContainer = document.createElement('div');
            pdfContainer.className = "pdf-page-container";
            let html = `<h2>Relatório de Viagens - ${currentUser}</h2><p>Gerado em: ${new Date().toLocaleDateString('pt-BR')}</p><hr>`;
            trips.forEach(t => {
                html += `<div class="pdf-card"><strong>${t.type}</strong><br>Data: ${formatDateTime(t.date)} | Transporte: ${t.notes}</div>`;
            });
            pdfContainer.innerHTML = html;
            html2pdf().set({ margin: 10, filename: `Viagens_${currentUser}.pdf`, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } }).from(pdfContainer).save();
        }

        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
