<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Viagens - Xerém</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #2e7d32; --primary-light: #4caf50; --dark: #1b5e20;
            --bg: #f1f8e9; --card: #ffffff; --text: #333333; --pdf-btn: #d32f2f;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }

        /* Overlay de Usuário */
        #userSelectionOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .user-btn { width: 80%; max-width: 300px; padding: 15px; margin: 10px; font-size: 18px; background: white; border: 2px solid var(--primary); color: var(--primary); border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        #loadingOverlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 10; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        select, input, button { padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-pdf { background-color: var(--pdf-btn); width: 100%; margin-top: 10px; }

        .summary-box { background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .travel-card { background: white; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #ddd; border-left: 5px solid var(--primary-light); }

        /* ESTILOS EXCLUSIVOS DO PDF */
        .pdf-area { padding: 40px; background: white; color: black; font-size: 12pt; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .pdf-table th, .pdf-table td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        .pdf-table th { background-color: #f2f2f2; }
        .pdf-item { page-break-inside: avoid; } /* Impede corte de linha no meio */
    </style>
</head>
<body>

    <div id="userSelectionOverlay">
        <h1 style="color: var(--dark)">Quem é você?</h1>
        <button class="user-btn" onclick="setUser('Gabriel')">Gabriel</button>
        <button class="user-btn" onclick="setUser('Rafael')">Rafael</button>
        <button class="user-btn" onclick="setUser('Juliana')">Juliana</button>
    </div>

    <div class="container">
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <p id="loadingText">Aguarde...</p>
        </div>

        <h1 id="userTitle">Minhas Viagens</h1>
        
        <form id="travelForm">
            <div class="form-group"><label>Data:</label><input type="date" id="date"></div>
            <div class="form-group" style="flex-direction:row; gap:20px;">
                <label><input type="checkbox" id="cIda" checked> Ida</label>
                <label><input type="checkbox" id="cVolta"> Volta</label>
            </div>
            <div class="form-group">
                <select id="notesSelect">
                    <option value="Carro do Berg">Carro do Berg</option>
                    <option value="Uber">Uber</option>
                </select>
            </div>
            <button type="submit" style="width: 100%">Salvar Viagem</button>
        </form>

        <hr style="margin:20px 0">

        <div class="summary-box">
            <div>Total: <span id="resCount">0</span> trechos</div>
            <div id="resTotal" style="font-size:20px; font-weight:bold">R$ 0,00</div>
        </div>

        <button class="btn-pdf" onclick="downloadPDF()">📄 Baixar Relatório PDF</button>

        <div id="list" style="margin-top: 20px;"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz2-8xldXs-VKsMiCIqwZyKR9K3Kl26VOCMHOiD47O9uQugqQZ1UK1zRBffD1vXnKMF/exec";
        const PRECO = 15.00;
        let currentUser = localStorage.getItem('viagens_user_fixed');
        let trips = [];

        if (currentUser) {
            document.getElementById('userSelectionOverlay').style.display = 'none';
            document.getElementById('userTitle').innerText = `Olá, ${currentUser}`;
            fetchTrips();
        }

        function setUser(name) {
            currentUser = name;
            localStorage.setItem('viagens_user_fixed', name);
            location.reload();
        }

        async function fetchTrips() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                trips = data.map(r => ({ date: r[0], passenger: r[1], type: r[2], notes: r[3] }))
                            .filter(t => t.passenger === currentUser);
                render();
            } catch (e) { alert("Erro ao carregar dados."); }
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        document.getElementById('travelForm').onsubmit = async (e) => {
            e.preventDefault();
            document.getElementById('loadingOverlay').style.display = 'flex';
            const date = document.getElementById('date').value;
            const notes = document.getElementById('notesSelect').value;
            
            if (document.getElementById('cIda').checked) await sendData(date, 'Ida', notes);
            if (document.getElementById('cVolta').checked) await sendData(date, 'Volta', notes);
            
            fetchTrips();
        };

        async function sendData(d, t, n) {
            const body = `date=${encodeURIComponent(d)}&passenger=${encodeURIComponent(currentUser)}&type=${encodeURIComponent(t)}&notes=${encodeURIComponent(n)}`;
            await fetch(API_URL, { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body });
        }

        function render() {
            document.getElementById('resCount').innerText = trips.length;
            document.getElementById('resTotal').innerText = (trips.length * PRECO).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
            const list = document.getElementById('list');
            list.innerHTML = trips.reverse().map(t => `
                <div class="travel-card">
                    <strong>${t.type}</strong> - ${new Date(t.date).toLocaleDateString('pt-BR')}<br>
                    <small>${t.notes}</small>
                </div>
            `).join('');
        }

        function downloadPDF() {
            if (trips.length === 0) return alert("Sem dados.");
            document.getElementById('loadingOverlay').style.display = 'flex';

            const worker = document.createElement('div');
            worker.className = "pdf-area";
            
            let tableRows = trips.map(t => `
                <tr class="pdf-item">
                    <td>${new Date(t.date).toLocaleDateString('pt-BR')}</td>
                    <td>${t.type}</td>
                    <td>${t.notes}</td>
                    <td>R$ 15,00</td>
                </tr>
            `).join('');

            worker.innerHTML = `
                <h1 style="color:#1b5e20">Relatório de Viagens</h1>
                <p>Passageiro: <strong>${currentUser}</strong></p>
                <p>Total de trechos: ${trips.length} | <strong>Total Geral: ${(trips.length * PRECO).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</strong></p>
                <table class="pdf-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Tipo</th>
                            <th>Transporte</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody>${tableRows}</tbody>
                </table>
            `;

            const opt = {
                margin: [15, 15],
                filename: `Relatorio_${currentUser}.pdf`,
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(worker).save().then(() => {
                document.getElementById('loadingOverlay').style.display = 'none';
            });
        }

        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
