<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Viagens - Xerém</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #2e7d32; --primary-light: #4caf50; --dark: #1b5e20;
            --bg: #f1f8e9; --card: #ffffff; --text: #333333;
            --pdf-btn: #d32f2f; --clear-btn: #c62828;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            max-width: 600px; width: 100%;
            background: var(--card); padding: 25px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        #loadingOverlay {
            display: none; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            border-radius: 12px; z-index: 100;
            justify-content: center; align-items: center;
            flex-direction: column; font-weight: bold;
        }

        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid var(--primary);
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin-bottom: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        h1, h2 { text-align: center; color: var(--dark); }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        select, input, button { padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; }
        
        .checkbox-group { display: flex; gap: 15px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; background: #eee; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-pdf { background-color: var(--pdf-btn); width: 100%; margin-bottom: 10px; }
        .btn-clear { background-color: transparent; color: var(--clear-btn); border: 1px solid var(--clear-btn); width: 100%; font-size: 13px; margin-top: 20px; }

        .summary-box {
            background: #e8f5e9; padding: 15px; border-radius: 8px;
            margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
        }

        .travel-card {
            background: white; padding: 12px; border-radius: 6px;
            margin-bottom: 10px; border: 1px solid #ddd; border-left: 5px solid var(--primary-light);
        }

        .badge { padding: 3px 8px; border-radius: 10px; font-size: 11px; color: white; font-weight: bold; }
        .badge-ida { background: #0288d1; } .badge-volta { background: #f57c00; }

        /* Estilo oculto que só o PDF usará */
        #pdf-template { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <span id="loadingText">Aguarde...</span>
        </div>

        <h1>📍 Destino: Xerém</h1>
        
        <form id="travelForm">
            <div class="form-group">
                <label>Passageiro(a):</label>
                <select id="passenger">
                    <option value="Gabriel">Gabriel</option>
                    <option value="Rafael">Rafael</option>
                    <option value="Juliana">Juliana</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tipo:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" id="cIda" checked> Ida</label>
                    <label class="checkbox-label"><input type="checkbox" id="cVolta"> Volta</label>
                </div>
            </div>

            <div class="form-group">
                <label>Data:</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label>Transporte:</label>
                <select id="notesSelect" onchange="toggleCustomNotes()">
                    <option value="Carro do Berg">Carro do Berg</option>
                    <option value="Uber">Uber</option>
                    <option value="Outro">Outro...</option>
                </select>
                <input type="text" id="customNotes" style="display:none; margin-top:5px;" placeholder="Qual?">
            </div>

            <button type="submit" id="btnSubmit">Salvar na Nuvem</button>
        </form>

        <hr style="margin: 25px 0;">

        <h2>Relatório Financeiro</h2>
        
        <div class="form-group">
            <label>Filtrar Nome:</label>
            <select id="filter" onchange="render()">
                <option value="Todos">Todos</option>
                <option value="Gabriel">Gabriel</option>
                <option value="Rafael">Rafael</option>
                <option value="Juliana">Juliana</option>
            </select>
        </div>

        <button class="btn-pdf" onclick="downloadPDF()">📄 Baixar PDF</button>

        <div class="summary-box">
            <div><p>Qtd: <span id="resCount">0</span></p></div>
            <div style="font-size: 20px; font-weight: bold;" id="resTotal">R$ 0,00</div>
        </div>

        <div id="list"></div>

        <button class="btn-clear" onclick="clearAllData()">⚠️ Limpar Tudo</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz2-8xldXs-VKsMiCIqwZyKR9K3Kl26VOCMHOiD47O9uQugqQZ1UK1zRBffD1vXnKMF/exec";
        const PRECO = 12.50;
        let trips = [];

        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        function showLoading(t) { document.getElementById('loadingText').innerText = t; document.getElementById('loadingOverlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

        function toggleCustomNotes() {
            const isOutro = document.getElementById('notesSelect').value === 'Outro';
            document.getElementById('customNotes').style.display = isOutro ? 'block' : 'none';
        }

        function formatDateTime(raw) {
            if (!raw) return "-";
            const d = new Date(raw);
            if (isNaN(d.getTime())) return raw;
            const dataF = d.toLocaleDateString('pt-BR');
            const horaF = d.toLocaleTimeString('pt-BR');
            return horaF === "00:00:00" ? dataF : `${dataF} às ${horaF}`;
        }

        async function fetchTripsFromCloud() {
            showLoading("Buscando dados...");
            try {
                const r = await fetch(API_URL);
                const data = await r.json();
                trips = data.map(row => ({ date: row[0], passenger: row[1], type: row[2], notes: row[3] }));
                render();
            } catch (e) { alert("Erro ao carregar dados."); }
            finally { hideLoading(); }
        }

        async function saveTripToCloud(trip) {
            showLoading("Salvando...");
            const body = Object.keys(trip).map(k => encodeURIComponent(k)+'='+encodeURIComponent(trip[k])).join('&');
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
        }

        document.getElementById('travelForm').onsubmit = async (e) => {
            e.preventDefault();
            const p = document.getElementById('passenger').value;
            const d = document.getElementById('date').value;
            const fullD = new Date(`${d}T${new Date().toTimeString().split(' ')[0]}`).toISOString();
            const n = document.getElementById('notesSelect').value === 'Outro' ? document.getElementById('customNotes').value : document.getElementById('notesSelect').value;
            
            if (document.getElementById('cIda').checked) await saveTripToCloud({ date: fullD, passenger: p, type: 'Ida', notes: n });
            if (document.getElementById('cVolta').checked) await saveTripToCloud({ date: fullD, passenger: p, type: 'Volta', notes: n });
            
            location.reload();
        };

        function render() {
            const f = document.getElementById('filter').value;
            const filtered = f === "Todos" ? trips : trips.filter(t => t.passenger === f);
            document.getElementById('resCount').innerText = filtered.length;
            document.getElementById('resTotal').innerText = (filtered.length * PRECO).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
            const list = document.getElementById('list');
            list.innerHTML = filtered.reverse().map(t => `
                <div class="travel-card">
                    <p><strong>${t.passenger}</strong> <span class="badge ${t.type==='Ida'?'badge-ida':'badge-volta'}">${t.type}</span></p>
                    <p style="font-size:13px; color:#666">📅 ${formatDateTime(t.date)} | 🚘 ${t.notes}</p>
                </div>
            `).join('');
        }

        async function downloadPDF() {
            const f = document.getElementById('filter').value;
            const filtered = f === "Todos" ? trips : trips.filter(t => t.passenger === f);
            if(!filtered.length) return alert("Sem dados.");

            showLoading("Gerando Relatório...");

            // Criar um container temporário fora da visão para o PDF
            const worker = document.createElement('div');
            worker.style.padding = "20px";
            worker.style.width = "700px"; // Largura fixa para evitar cortes
            worker.style.background = "white";

            let html = `
                <div style="text-align:center; border-bottom:2px solid #2e7d32; padding-bottom:10px; margin-bottom:20px;">
                    <h1 style="margin:0; color:#1b5e20;">Relatório de Viagens - Xerém</h1>
                    <p>Filtro: ${f} | Gerado em: ${new Date().toLocaleDateString('pt-BR')}</p>
                </div>
                <div style="display:flex; justify-content:space-between; background:#f1f8e9; padding:15px; border-radius:8px; margin-bottom:20px;">
                    <b>Total de Viagens: ${filtered.length}</b>
                    <b style="color:#2e7d32;">Valor Total: ${(filtered.length * PRECO).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</b>
                </div>
            `;

            filtered.forEach(t => {
                html += `
                    <div style="border:1px solid #ddd; border-left:5px solid #4caf50; padding:10px; margin-bottom:8px; border-radius:4px; page-break-inside:avoid;">
                        <div style="display:flex; justify-content:space-between;">
                            <b>${t.passenger} (${t.type})</b>
                            <span style="font-size:12px; color:#666;">${formatDateTime(t.date)}</span>
                        </div>
                        <div style="font-size:13px; margin-top:5px;">Transporte: ${t.notes}</div>
                    </div>
                `;
            });

            worker.innerHTML = html;
            document.body.appendChild(worker); // Adiciona temporariamente para o html2canvas ler

            const opt = {
                margin: 10,
                filename: `Relatorio_Xerem_${f}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false, width: 700 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            try {
                await html2pdf().set(opt).from(worker).save();
            } finally {
                document.body.removeChild(worker);
                hideLoading();
            }
        }

        async function clearAllData() {
            if (confirm("Apagar TUDO da planilha?")) {
                showLoading("Limpando...");
                await saveTripToCloud({ action: "CLEAR_ALL" });
                location.reload();
            }
        }

        fetchTripsFromCloud();
    </script>
</body>
</html>
